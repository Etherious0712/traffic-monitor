<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traffic Monitor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23e5484d'/></svg>">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
<style>
  :root {
    color-scheme: light;
    --bg: #f7f7f8; --panel: #ffffff; --text: #1c1c1f; --muted: #6b6b73; --line: #e4e4e7; --chip: #f0f0f2;
    --warn-bg: #fff4d6; --warn-text: #6b4a00; --err: #b42318; --series-1: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111113; --panel: #18181b; --text: #ececef; --muted: #9b9ba3; --line: #2a2a2f; --chip: #232328;
      --warn-bg: #3a2c05; --warn-text: #ffd479; --err: #ff8a80; --series-1: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111113; --panel: #18181b; --text: #ececef; --muted: #9b9ba3; --line: #2a2a2f; --chip: #232328;
    --warn-bg: #3a2c05; --warn-text: #ffd479; --err: #ff8a80; --series-1: #3987e5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; }
  select, button { font: inherit; font-size: 13px; color: var(--text); background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
  button { cursor: pointer; }
  button[aria-pressed="true"] { background: var(--text); color: var(--panel); border-color: var(--text); }
  #warnings { background: var(--warn-bg); color: var(--warn-text); padding: 8px 16px; font-size: 13px; }
  #warnings:empty { display: none; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 380px; }
  #map { min-height: 0; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 16px 6px; }
  .notice { margin: 10px 16px 0; font-size: 13px; color: var(--muted); }
  .notice.err { color: var(--err); }
  ul, ol { list-style: none; margin: 0; padding: 0; }
  .inc { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .inc:hover, .inc:focus-visible { background: var(--chip); outline: none; }
  .inc .road { font-weight: 600; }
  .inc .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 5px; background: var(--chip); color: var(--text); border-radius: 999px; padding: 1px 8px; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .summary { margin-top: 4px; font-size: 13px; }
  a { color: inherit; }
  .news li { padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .news .src, .src { color: var(--muted); font-size: 12px; }

  /* history */
  .hist { padding: 0 16px 8px; }
  .ranges { display: flex; gap: 6px; margin-bottom: 10px; }
  .chart-title { font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { fill: var(--muted); font-size: 10px; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .series { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linejoin: round; }
  .bar { fill: var(--series-1); }
  .bar:hover, .bar:focus { opacity: .75; outline: none; }
  .cross { stroke: var(--muted); stroke-width: 1; }
  .marker { fill: var(--series-1); stroke: var(--panel); stroke-width: 2; }
  .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; white-space: nowrap; box-shadow: 0 2px 8px rgb(0 0 0 / .15); transform: translate(-50%, -100%); z-index: 2; }
  .tip strong { display: block; font-size: 13px; }
  .tip span { color: var(--muted); }
  .hbars li { display: grid; grid-template-columns: 96px 1fr 28px; gap: 8px; align-items: center; font-size: 12px; margin: 4px 0; }
  .hbars .track { height: 8px; }
  .hbars .fill { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbars .val { text-align: right; font-variant-numeric: tabular-nums; }
  .roads li { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .roads .src { white-space: nowrap; }

  footer { margin-top: auto; padding: 12px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
  .maplibregl-popup-content { background: var(--panel); color: var(--text); }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
    body { height: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>Traffic Monitor</h1>
  <select id="region" aria-label="City"></select>
  <span class="meta" id="updated">Loading…</span>
</header>
<div id="warnings" role="status"></div>
<main>
  <div id="map" aria-label="Traffic map"></div>
  <aside>
    <div id="notices"></div>
    <h2>Jams &amp; incidents</h2>
    <ul id="incidents"></ul>
    <h2>History</h2>
    <div class="hist">
      <div class="ranges" role="group" aria-label="Time range">
        <button data-days="1">24 h</button><button data-days="7">7 days</button><button data-days="30">30 days</button>
      </div>
      <div id="history"></div>
    </div>
    <h2>Traffic news (last 3 h)</h2>
    <ul class="news" id="news"></ul>
    <footer><span id="ver"></span>Data: TomTom · MET Malaysia (data.gov.my) · Malaysian news RSS · Map © OpenFreeMap, OpenStreetMap</footer>
  </aside>
</main>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
<script>
const CAUSE = {
  accident: ['Accident', '#e5484d'], breakdown: ['Breakdown', '#f76b15'], roadworks: ['Roadworks', '#d39a00'],
  closure: ['Road closed', '#8e4ec6'], weather: ['Weather', '#0090ff'], hazard: ['Hazard', '#d6409f'],
  event: ['Event', '#12a594'], peak_hour: ['Rush hour', '#8d8d8d'], unknown: ['Unknown', '#8d8d8d'],
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (u) => (/^https?:\/\//.test(u) ? esc(u) : '#');
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};

const map = new maplibregl.Map({
  container: 'map',
  style: `https://tiles.openfreemap.org/styles/${dark ? 'dark' : 'positron'}`,
  center: [101.62, 3.1], zoom: 10.5,
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');

let state = null;
let mapReady = false;
let region = store.get('region');
let days = Number(store.get('days')) || 7;
let historyFor = '';
const colorExpr = ['match', ['get', 'cause'], ...Object.entries(CAUSE).flatMap(([k, [, c]]) => [k, c]), '#8d8d8d'];

map.on('load', () => {
  map.addSource('incidents', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'inc-lines', type: 'line', source: 'incidents', filter: ['==', ['geometry-type'], 'LineString'],
    paint: { 'line-color': colorExpr, 'line-width': ['+', 3, ['get', 'magnitude']], 'line-opacity': 0.85 } });
  map.addLayer({ id: 'inc-points', type: 'circle', source: 'incidents', filter: ['==', ['geometry-type'], 'Point'],
    paint: { 'circle-color': colorExpr, 'circle-radius': 7, 'circle-stroke-width': 2, 'circle-stroke-color': '#fff' } });
  for (const layer of ['inc-lines', 'inc-points']) {
    map.on('click', layer, (e) => showPopup(e.features[0].properties.id, e.lngLat));
    map.on('mouseenter', layer, () => (map.getCanvas().style.cursor = 'pointer'));
    map.on('mouseleave', layer, () => (map.getCanvas().style.cursor = ''));
  }
  mapReady = true;
  if (state) render();
});

const regionInfo = () => state.regions.find((r) => r.id === region);
const roadName = (i) => [i.roadNumbers?.length ? i.label : '', i.from && i.to ? `${i.from} → ${i.to}` : i.from || i.to].filter(Boolean).join(' · ') || 'Unnamed road';
const delayText = (i) => (i.delay ? `+${Math.round(i.delay / 60)} min` : i.magnitudeOfDelay === 4 ? 'Closed' : '');
const chip = (c) => `<span class="chip"><span class="dot" style="background:${CAUSE[c]?.[1] ?? '#8d8d8d'}"></span>${esc(CAUSE[c]?.[0] ?? c)}</span>`;
const evidence = (cause) => cause.evidence.map((u, n) => ` <a href="${safeUrl(u)}" target="_blank" rel="noopener">source ${n + 1}</a>`).join('');

function showPopup(id, lngLat) {
  const i = state.incidents.find((x) => x.id === id);
  if (!i) return;
  new maplibregl.Popup({ maxWidth: '300px' }).setLngLat(lngLat).setHTML(
    `<strong>${esc(roadName(i))}</strong><br>${chip(i.cause.cause)} ${esc(delayText(i))}
     <div class="summary">${esc(i.cause.summary)}</div>
     <small>${esc(i.cause.source)} · ${esc(i.cause.confidence)} confidence${evidence(i.cause)}</small>`).addTo(map);
}

function flyToRegion() {
  const r = regionInfo();
  if (r && mapReady) map.fitBounds([[r.bbox[0], r.bbox[1]], [r.bbox[2], r.bbox[3]]], { padding: 20, duration: 800 });
}

function render() {
  const s = state;
  if (!s.regions.some((r) => r.id === region)) region = s.regions[0].id;
  const counts = Object.fromEntries(s.regions.map((r) => [r.id, s.incidents.filter((i) => i.region === r.id).length]));
  const option = (r) => `<option value="${esc(r.id)}"${r.id === region ? ' selected' : ''}>${esc(r.name)}${s.traffic && r.updatedAt ? ` (${counts[r.id]})` : ''}</option>`;
  $('region').innerHTML = [...new Set(s.regions.map((r) => r.group))]
    .map((g) => `<optgroup label="${esc(g)}">${s.regions.filter((r) => r.group === g).map(option).join('')}</optgroup>`).join('');
  // Cities nobody is watching refresh every few hours, so show this city's own time and say when it's catching up.
  const at = regionInfo().updatedAt;
  $('updated').textContent = !s.traffic ? '' : !at ? 'Loading this city…'
    : Date.now() - Date.parse(at) > 6 * 60e3 ? `Updated ${new Date(at).toLocaleTimeString()} · refreshing…` : `Updated ${new Date(at).toLocaleTimeString()}`;
  $('ver').textContent = `v${s.version} · `;
  $('warnings').innerHTML = s.warnings.filter((w) => w.regions.includes(region))
    .map((w) => `⚠ ${esc(w.title)} (until ${esc(w.validTo.replace('T', ' ').slice(0, 16))})`).join('<br>');

  const notes = [];
  if (!s.traffic) notes.push(['', 'No TOMTOM_KEY set — showing news and weather only. Add a free key to see live traffic.']);
  for (const [k, v] of Object.entries(s.errors)) notes.push(['err', `${k}: ${v}`]);
  $('notices').innerHTML = notes.map(([c, t]) => `<p class="notice ${c}">${esc(t)}</p>`).join('');

  const mine = s.incidents.filter((i) => i.region === region);
  $('incidents').innerHTML = mine.length ? mine.map((i) => `
    <li class="inc" tabindex="0" data-id="${esc(i.id)}">
      <div class="road">${esc(roadName(i))}</div>
      <div class="row">${chip(i.cause.cause)}<span>${esc(delayText(i))}</span><span>${esc(i.cause.source)} · ${esc(i.cause.confidence)}</span></div>
      <div class="summary">${esc(i.cause.summary)}${evidence(i.cause)}</div>
    </li>`).join('') : `<li class="notice">${s.traffic ? 'No incidents right now.' : ''}</li>`;

  $('news').innerHTML = s.news.length ? s.news.map((n) => `
    <li><a href="${safeUrl(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a>
      <div class="src">${esc(n.source)} · ${new Date(n.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div></li>`).join('')
    : '<li class="src">No traffic news in the last 3 hours.</li>';

  for (const b of document.querySelectorAll('.ranges button')) b.setAttribute('aria-pressed', String(Number(b.dataset.days) === days));
  const key = `${region}|${days}|${s.updatedAt}`;
  if (key !== historyFor) {
    historyFor = key;
    loadHistory();
  }

  if (!mapReady) return;
  if (s.traffic && !map.getSource('flow')) {
    map.addSource('flow', { type: 'raster', tiles: [`${location.origin}/tiles/flow/{z}/{x}/{y}.png`], tileSize: 256, attribution: '© TomTom' });
    map.addLayer({ id: 'flow', type: 'raster', source: 'flow', paint: { 'raster-opacity': 0.8 } }, 'inc-lines');
  }
  map.getSource('incidents').setData({ type: 'FeatureCollection', features: s.incidents.filter((i) => i.geometry).map((i) => ({
    type: 'Feature', geometry: i.geometry, properties: { id: i.id, cause: i.cause.cause, magnitude: i.magnitudeOfDelay ?? 0 },
  })) });
}

// ---------- history ----------

const SVG = 'http://www.w3.org/2000/svg';
function el(name, attrs = {}, parent) {
  const n = document.createElementNS(SVG, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  parent?.appendChild(n);
  return n;
}
function text(parent, x, y, str, anchor = 'start') {
  const t = el('text', { x, y, 'text-anchor': anchor }, parent);
  t.textContent = str;
  return t;
}
// Tooltip: value first (strong), label second. textContent only.
function tip(box, x, y, value, label) {
  let t = box.querySelector('.tip');
  if (!t) { t = document.createElement('div'); t.className = 'tip'; box.appendChild(t); }
  t.replaceChildren(Object.assign(document.createElement('strong'), { textContent: value }), Object.assign(document.createElement('span'), { textContent: label }));
  t.style.left = `${x}px`;
  t.style.top = `${y - 6}px`;
  t.hidden = false;
}
const hideTip = (box) => { const t = box.querySelector('.tip'); if (t) t.hidden = true; };
const niceMax = (v) => {
  if (v <= 0) return 1;
  const p = 10 ** Math.floor(Math.log10(v));
  return [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find((m) => v <= m * p) * p;
};
const W = 348;
// Axis ends show the date (or time for 24 h); tooltips always show day + time.
const fmtAxis = (t) => new Date(t).toLocaleString([], days > 1 ? { day: 'numeric', month: 'short' } : { weekday: 'short', hour: '2-digit', minute: '2-digit' });
const fmtTime = (t) => new Date(t).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

function chartBox(title) {
  const wrap = document.createElement('div');
  wrap.append(Object.assign(document.createElement('div'), { className: 'chart-title', textContent: title }));
  const box = document.createElement('div');
  box.className = 'chart';
  wrap.append(box);
  return [wrap, box];
}

// Line: hourly average of active incidents, crosshair + tooltip that snaps to the nearest hour.
function lineChart(series) {
  const [wrap, box] = chartBox('Active incidents (hourly average)');
  const H = 110, L = 26, R = 6, T = 8, B = 18;
  const max = niceMax(Math.max(...series.map((p) => p.incidents)));
  const t0 = series[0].t, t1 = series.at(-1).t || t0 + 1;
  const x = (t) => L + ((t - t0) / Math.max(t1 - t0, 1)) * (W - L - R);
  const y = (v) => T + (1 - v / max) * (H - T - B);
  const peak = series.reduce((a, b) => (b.incidents > a.incidents ? b : a));
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `Active incidents per hour. Peak ${peak.incidents} at ${fmtTime(peak.t)}.` }, box);
  for (const v of [0, max / 2, max]) {
    el('line', { class: 'grid', x1: L, x2: W - R, y1: y(v), y2: y(v) }, svg);
    text(svg, L - 4, y(v) + 3, String(Math.round(v)), 'end');
  }
  text(svg, L, H - 4, fmtAxis(t0));
  text(svg, W - R, H - 4, fmtAxis(t1), 'end');
  el('path', { class: 'series', d: series.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p.incidents).toFixed(1)}`).join('') }, svg);
  const cross = el('line', { class: 'cross', y1: T, y2: H - B, visibility: 'hidden' }, svg);
  const dot = el('circle', { class: 'marker', r: 4, visibility: 'hidden' }, svg);
  const hit = el('rect', { x: L, y: 0, width: W - L - R, height: H, fill: 'transparent', tabindex: 0 }, svg);
  const show = (p) => {
    const px = x(p.t), py = y(p.incidents), k = box.clientWidth / W;
    for (const n of [cross, dot]) n.setAttribute('visibility', 'visible');
    cross.setAttribute('x1', px); cross.setAttribute('x2', px);
    dot.setAttribute('cx', px); dot.setAttribute('cy', py);
    tip(box, px * k, py * k, `${p.incidents} incidents`, `${fmtTime(p.t)} · ${p.delayMin} min total delay`);
  };
  hit.addEventListener('pointermove', (e) => {
    const r = svg.getBoundingClientRect();
    const t = t0 + (((e.clientX - r.left) * (W / r.width) - L) / (W - L - R)) * (t1 - t0);
    show(series.reduce((a, b) => (Math.abs(b.t - t) < Math.abs(a.t - t) ? b : a)));
  });
  hit.addEventListener('focus', () => show(peak));
  const off = () => { cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); hideTip(box); };
  hit.addEventListener('pointerleave', off);
  hit.addEventListener('blur', off);
  return wrap;
}

// Bars: average total delay by hour of day (Malaysia time). Each bar is its own hover/focus target.
function hourChart(byHour) {
  const [wrap, box] = chartBox('Typical delay by hour of day (min, Malaysia time)');
  const H = 100, L = 26, R = 6, T = 8, B = 18;
  const vals = Array.from({ length: 24 }, (_, h) => byHour.find((r) => r.hour === h)?.delayMin ?? null);
  const max = niceMax(Math.max(...vals.map((v) => v ?? 0)));
  const slot = (W - L - R) / 24, bw = slot - 2;
  const y = (v) => T + (1 - v / max) * (H - T - B);
  const worst = vals.indexOf(Math.max(...vals.map((v) => v ?? -1)));
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `Delay by hour of day. Worst around ${worst}:00.` }, box);
  for (const v of [0, max]) {
    el('line', { class: 'grid', x1: L, x2: W - R, y1: y(v), y2: y(v) }, svg);
    text(svg, L - 4, y(v) + 3, String(v), 'end');
  }
  vals.forEach((v, h) => {
    if (h % 6 === 0) text(svg, L + h * slot + bw / 2, H - 4, `${String(h).padStart(2, '0')}:00`, 'middle');
    if (v === null) return;
    const x0 = L + h * slot + 1, top = y(v), base = y(0), r = Math.min(4, bw / 2, base - top);
    // Rounded at the data end, square on the baseline
    const bar = el('path', { class: 'bar', tabindex: 0, d: `M${x0},${base}V${top + r}Q${x0},${top} ${x0 + r},${top}H${x0 + bw - r}Q${x0 + bw},${top} ${x0 + bw},${top + r}V${base}Z` }, svg);
    el('title', {}, bar).textContent = `${h}:00 — ${v} min`;
    const show = () => { const k = box.clientWidth / W; tip(box, (x0 + bw / 2) * k, top * k, `${v} min`, `${String(h).padStart(2, '0')}:00–${String(h + 1).padStart(2, '0')}:00`); };
    bar.addEventListener('pointerenter', show);
    bar.addEventListener('focus', show);
    bar.addEventListener('pointerleave', () => hideTip(box));
    bar.addEventListener('blur', () => hideTip(box));
  });
  return wrap;
}

function causeBars(causes) {
  const [wrap, box] = chartBox('Causes');
  const max = Math.max(...causes.map((c) => c.n));
  const ul = document.createElement('ul');
  ul.className = 'hbars';
  for (const c of causes) {
    const li = document.createElement('li');
    const label = Object.assign(document.createElement('span'), { textContent: CAUSE[c.cause]?.[0] ?? c.cause });
    const track = Object.assign(document.createElement('div'), { className: 'track' });
    const fill = Object.assign(document.createElement('div'), { className: 'fill' });
    fill.style.width = `${(c.n / max) * 100}%`;
    fill.style.background = CAUSE[c.cause]?.[1] ?? '#8d8d8d';
    track.append(fill);
    li.append(label, track, Object.assign(document.createElement('span'), { className: 'val', textContent: c.n }));
    ul.append(li);
  }
  box.append(ul);
  return wrap;
}

function roadList(roads) {
  const [wrap, box] = chartBox('Most affected roads');
  const ol = document.createElement('ol');
  ol.className = 'roads';
  for (const r of roads) {
    const li = document.createElement('li');
    li.append(Object.assign(document.createElement('span'), { textContent: r.road }),
      Object.assign(document.createElement('span'), { className: 'src', textContent: `${r.n}× · worst +${r.worstMin} min` }));
    ol.append(li);
  }
  box.append(ol);
  return wrap;
}

async function loadHistory() {
  const out = $('history');
  if (!state.history || !state.traffic) {
    out.innerHTML = `<p class="src">${state.traffic ? 'History is off.' : 'History starts once a TomTom key is set.'}</p>`;
    return;
  }
  const want = `${region}|${days}`;
  let h;
  try {
    h = await (await fetch(`/api/history?region=${encodeURIComponent(region)}&days=${days}`)).json();
  } catch {
    out.innerHTML = '<p class="src">Could not load history.</p>';
    return;
  }
  if (want !== `${region}|${days}`) return; // user switched while loading
  if (h.series.length < 2) {
    out.innerHTML = '<p class="src">Not enough history yet. It builds up while the app runs (cities nobody is watching are recorded every 3 hours).</p>';
    return;
  }
  out.replaceChildren(lineChart(h.series), hourChart(h.byHour), ...(h.causes.length ? [causeBars(h.causes)] : []), ...(h.roads.length ? [roadList(h.roads)] : []));
}

// ---------- events ----------

$('region').addEventListener('change', (e) => {
  region = e.target.value;
  store.set('region', region);
  render();
  flyToRegion();
  refreshSoon();
});
document.querySelector('.ranges').addEventListener('click', (e) => {
  const d = Number(e.target.dataset?.days);
  if (!d) return;
  days = d;
  store.set('days', String(d));
  render();
});
$('incidents').addEventListener('click', focusIncident);
$('incidents').addEventListener('keydown', (e) => e.key === 'Enter' && focusIncident(e));
function focusIncident(e) {
  const li = e.target.closest('.inc');
  if (!li || e.target.closest('a')) return;
  const i = state.incidents.find((x) => x.id === li.dataset.id);
  const c = i?.geometry?.type === 'Point' ? i.geometry.coordinates : i?.geometry?.coordinates?.[Math.floor(i.geometry.coordinates.length / 2)];
  if (!c) return;
  map.flyTo({ center: c, zoom: 14 });
  showPopup(i.id, c);
}

async function refresh() {
  try {
    const first = !state;
    // `watch` tells the server which city is on screen, so it refreshes that one every few minutes
    state = await (await fetch(`/api/state${region ? `?watch=${encodeURIComponent(region)}` : ''}`)).json();
    render();
    if (first) {
      mapReady ? flyToRegion() : map.once('load', flyToRegion);
      refreshSoon();
    }
  } catch {
    $('updated').textContent = 'Server unreachable, retrying…';
  }
}
refresh();
setInterval(refresh, 60e3);
// After switching city (or first load) the server fetches it within ~30 s; check back then instead of waiting a minute.
function refreshSoon() {
  refresh();
  setTimeout(refresh, 35e3);
}
</script>
</body>
