<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traffic Monitor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23e5484d'/></svg>">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --text: #1c1c1f; --muted: #6b6b73; --line: #e4e4e7; --chip: #f0f0f2;
    --warn-bg: #fff4d6; --warn-text: #6b4a00; --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111113; --panel: #18181b; --text: #ececef; --muted: #9b9ba3; --line: #2a2a2f; --chip: #232328;
      --warn-bg: #3a2c05; --warn-text: #ffd479; --err: #ff8a80;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111113; --panel: #18181b; --text: #ececef; --muted: #9b9ba3; --line: #2a2a2f; --chip: #232328;
    --warn-bg: #3a2c05; --warn-text: #ffd479; --err: #ff8a80;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; }
  #warnings { background: var(--warn-bg); color: var(--warn-text); padding: 8px 16px; font-size: 13px; }
  #warnings:empty { display: none; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 380px; }
  #map { min-height: 0; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 16px 6px; }
  .notice { margin: 10px 16px 0; font-size: 13px; color: var(--muted); }
  .notice.err { color: var(--err); }
  ul { list-style: none; margin: 0; padding: 0; }
  .inc { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .inc:hover, .inc:focus-visible { background: var(--chip); outline: none; }
  .inc .road { font-weight: 600; }
  .inc .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 5px; background: var(--chip); color: var(--text); border-radius: 999px; padding: 1px 8px; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .summary { margin-top: 4px; font-size: 13px; }
  a { color: inherit; }
  .news li { padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .news .src { color: var(--muted); font-size: 12px; }
  footer { margin-top: auto; padding: 12px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
  .maplibregl-popup-content { background: var(--panel); color: var(--text); }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
    body { height: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>Traffic Monitor</h1>
  <span class="meta" id="region">Malaysia</span>
  <span class="meta" id="updated">Loading…</span>
</header>
<div id="warnings" role="status"></div>
<main>
  <div id="map" aria-label="Traffic map"></div>
  <aside>
    <div id="notices"></div>
    <h2>Jams &amp; incidents</h2>
    <ul id="incidents"></ul>
    <h2>Traffic news (last 3 h)</h2>
    <ul class="news" id="news"></ul>
    <footer><span id="ver"></span>Data: TomTom · MET Malaysia (data.gov.my) · Malaysian news RSS · Map © OpenFreeMap, OpenStreetMap</footer>
  </aside>
</main>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
<script>
const CAUSE = {
  accident: ['Accident', '#e5484d'], breakdown: ['Breakdown', '#f76b15'], roadworks: ['Roadworks', '#d39a00'],
  closure: ['Road closed', '#8e4ec6'], weather: ['Weather', '#0090ff'], hazard: ['Hazard', '#d6409f'],
  event: ['Event', '#12a594'], peak_hour: ['Rush hour', '#8d8d8d'], unknown: ['Unknown', '#8d8d8d'],
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (u) => (/^https?:\/\//.test(u) ? esc(u) : '#');
const dark = matchMedia('(prefers-color-scheme: dark)').matches;

const map = new maplibregl.Map({
  container: 'map',
  style: `https://tiles.openfreemap.org/styles/${dark ? 'dark' : 'positron'}`,
  center: [101.62, 3.1], zoom: 10.5,
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');

let state = null;
let mapReady = false;
const colorExpr = ['match', ['get', 'cause'], ...Object.entries(CAUSE).flatMap(([k, [, c]]) => [k, c]), '#8d8d8d'];

map.on('load', () => {
  map.addSource('incidents', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'inc-lines', type: 'line', source: 'incidents', filter: ['==', ['geometry-type'], 'LineString'],
    paint: { 'line-color': colorExpr, 'line-width': ['+', 3, ['get', 'magnitude']], 'line-opacity': 0.85 } });
  map.addLayer({ id: 'inc-points', type: 'circle', source: 'incidents', filter: ['==', ['geometry-type'], 'Point'],
    paint: { 'circle-color': colorExpr, 'circle-radius': 7, 'circle-stroke-width': 2, 'circle-stroke-color': '#fff' } });
  for (const layer of ['inc-lines', 'inc-points']) {
    map.on('click', layer, (e) => showPopup(e.features[0].properties.id, e.lngLat));
    map.on('mouseenter', layer, () => (map.getCanvas().style.cursor = 'pointer'));
    map.on('mouseleave', layer, () => (map.getCanvas().style.cursor = ''));
  }
  mapReady = true;
  if (state) render();
});

const roadName = (i) => [i.roadNumbers?.join('/'), i.from && i.to ? `${i.from} → ${i.to}` : i.from || i.to].filter(Boolean).join(' · ') || 'Unnamed road';
const delayText = (i) => (i.delay ? `+${Math.round(i.delay / 60)} min` : i.magnitudeOfDelay === 4 ? 'Closed' : '');
const chip = (c) => `<span class="chip"><span class="dot" style="background:${CAUSE[c]?.[1] ?? '#8d8d8d'}"></span>${esc(CAUSE[c]?.[0] ?? c)}</span>`;
const evidence = (cause) => cause.evidence.map((u, n) => ` <a href="${safeUrl(u)}" target="_blank" rel="noopener">source ${n + 1}</a>`).join('');

function showPopup(id, lngLat) {
  const i = state.incidents.find((x) => x.id === id);
  if (!i) return;
  new maplibregl.Popup({ maxWidth: '300px' }).setLngLat(lngLat).setHTML(
    `<strong>${esc(roadName(i))}</strong><br>${chip(i.cause.cause)} ${esc(delayText(i))}
     <div class="summary">${esc(i.cause.summary)}</div>
     <small>${esc(i.cause.source)} · ${esc(i.cause.confidence)} confidence${evidence(i.cause)}</small>`).addTo(map);
}

function render() {
  const s = state;
  $('region').textContent = s.regions.join(', ');
  $('updated').textContent = s.updatedAt ? `Updated ${new Date(s.updatedAt).toLocaleTimeString()}` : 'Waiting for first update…';
  $('ver').textContent = `v${s.version} · `;
  $('warnings').innerHTML = s.warnings.map((w) => `⚠ ${esc(w.title)} (until ${esc(w.validTo.replace('T', ' ').slice(0, 16))})`).join('<br>');

  const notes = [];
  if (!s.traffic) notes.push(['', 'No TOMTOM_KEY set — showing news and weather only. Add a free key to see live traffic.']);
  for (const [k, v] of Object.entries(s.errors)) notes.push(['err', `${k}: ${v}`]);
  $('notices').innerHTML = notes.map(([c, t]) => `<p class="notice ${c}">${esc(t)}</p>`).join('');

  $('incidents').innerHTML = s.incidents.length ? s.incidents.map((i) => `
    <li class="inc" tabindex="0" data-id="${esc(i.id)}">
      <div class="road">${esc(roadName(i))}</div>
      <div class="row">${chip(i.cause.cause)}<span>${esc(delayText(i))}</span><span>${esc(i.cause.source)} · ${esc(i.cause.confidence)}</span></div>
      <div class="summary">${esc(i.cause.summary)}${evidence(i.cause)}</div>
    </li>`).join('') : `<li class="notice">${s.traffic ? 'No incidents right now.' : ''}</li>`;

  $('news').innerHTML = s.news.length ? s.news.map((n) => `
    <li><a href="${safeUrl(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a>
      <div class="src">${esc(n.source)} · ${new Date(n.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div></li>`).join('')
    : '<li class="src">No traffic news in the last 3 hours.</li>';

  if (!mapReady) return;
  if (s.traffic && !map.getSource('flow')) {
    map.addSource('flow', { type: 'raster', tiles: [`${location.origin}/tiles/flow/{z}/{x}/{y}.png`], tileSize: 256, attribution: '© TomTom' });
    map.addLayer({ id: 'flow', type: 'raster', source: 'flow', paint: { 'raster-opacity': 0.8 } }, 'inc-lines');
  }
  map.getSource('incidents').setData({ type: 'FeatureCollection', features: s.incidents.filter((i) => i.geometry).map((i) => ({
    type: 'Feature', geometry: i.geometry, properties: { id: i.id, cause: i.cause.cause, magnitude: i.magnitudeOfDelay ?? 0 },
  })) });
}

$('incidents').addEventListener('click', focusIncident);
$('incidents').addEventListener('keydown', (e) => e.key === 'Enter' && focusIncident(e));
function focusIncident(e) {
  const li = e.target.closest('.inc');
  if (!li || e.target.closest('a')) return;
  const i = state.incidents.find((x) => x.id === li.dataset.id);
  const c = i?.geometry?.type === 'Point' ? i.geometry.coordinates : i?.geometry?.coordinates?.[Math.floor(i.geometry.coordinates.length / 2)];
  if (!c) return;
  map.flyTo({ center: c, zoom: 14 });
  showPopup(i.id, c);
}

async function refresh() {
  try {
    state = await (await fetch('/api/state')).json();
    render();
  } catch {
    $('updated').textContent = 'Server unreachable, retrying…';
  }
}
refresh();
setInterval(refresh, 60e3);
</script>
</body>
</html>
